name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  # pr-preview-action posts a sticky PR comment with the preview link,
  # which needs this even though the underlying REST endpoint is
  # "issues/comments" (a PR is an issue under the hood).
  pull-requests: write

jobs:
  deploy-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # A fixed group, not ${{ github.ref }}: for a *closed* pull_request
    # event, github.ref resolves to the base branch (refs/heads/main) —
    # same as a push to main — once GitHub deletes the PR's own
    # refs/pull/<n>/merge ref on close. A merge's push and that same PR's
    # closed-cleanup event land in the same instant, so a shared
    # ${{ github.ref }} group meant this job kept losing the race and
    # getting cancelled by the unrelated preview-cleanup job below,
    # silently skipping the real production deploy on every merge.
    concurrency:
      group: pages-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: app/dist
          # The preview job below keeps PR previews under pr-preview/ on
          # this same branch — never force-push (it would recreate the
          # branch as a single new commit and wipe them), and exclude
          # that path from the normal clean-stale-files pass.
          force: false
          clean-exclude: pr-preview/

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Keyed by PR number rather than github.ref for the same reason as
    # deploy-production's group above — scoped per-PR so two different
    # PRs' preview builds never contend, while a rapid second push to the
    # same PR still cancels its own stale in-progress preview.
    concurrency:
      group: pages-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build app
        if: github.event.action != 'closed'
        working-directory: app
        run: |
          npm ci
          npm run build

      # Deploys app/dist to pr-preview/pr-<number>/ on opened/reopened/
      # synchronize, and removes that folder on closed — action: auto
      # (the default) picks the right behavior from the PR event itself.
      # The build's relative (base: './') asset paths are what make the
      # exact same app/dist output work correctly at this nested
      # subpath as well as at the site root.
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: app/dist
