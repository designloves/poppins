<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- No viewport-fit=cover: that opts the page into extending under
         the status bar/home indicator, which in turn makes Safari try to
         color-match its own chrome to nearby page content — a heuristic
         that's unreliable and can get stuck (confirmed: this app never
         had this problem before viewport-fit=cover was added). Without
         it, the page stays within the safe area and Safari just fills
         those strips with its own plain, unchanging default — not
         matching the app, but never inconsistent either. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Poppins</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
